
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Record Camp Donation</h2>
    <h5>{{ camp.name }}</h5>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Record Donation
        </button>

        <a href="{% url 'camp-manage' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
