{% extends "base.html" %}
{% block title %}Dashboard - BBMS{% endblock %}
{% block content %}
<h1>Welcome, {{ user.get_full_name|default:user.username }}</h1>
<p class="center">Role: <strong>{{ user.get_role_display }}</strong></p>
<p class="center">This dashboard is a placeholder.</p>
<form method="post" action="{% url 'logout' %}" class="center">
  {% csrf_token %}
  <button type="submit">Logout</button>
</form>
{% endblock %}
