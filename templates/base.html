<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blood Bank Management System{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fdf2f2; color: #222; }
    main { padding: 1.5rem; width: 100%; max-width: 26rem; box-sizing: border-box; }
    h1 { color: #b71c1c; font-size: clamp(1.5rem, 5vw, 2rem); text-align: center; }
    form p { display: flex; flex-direction: column; margin: .8rem 0; }
    label { font-weight: 600; margin-bottom: .25rem; }
    input, select { padding: .6rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; }
    .helptext { font-size: .8rem; color: #666; }
    .errorlist { color: #b71c1c; list-style: none; padding: 0; margin: .25rem 0; font-size: .9rem; }
    button, .btn { display: inline-block; padding: .6rem 1.2rem; background: #b71c1c; color: #fff; border: 0; border-radius: 6px; font-size: 1rem; text-decoration: none; cursor: pointer; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
