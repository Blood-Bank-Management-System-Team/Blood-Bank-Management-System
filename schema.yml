      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodUnit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodUnit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodUnit'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodUnit'
          description: ''
  /api/inventory/{id}/:
