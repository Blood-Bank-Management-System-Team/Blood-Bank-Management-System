openapi: 3.0.3
info:
  title: Blood Bank Management System API
  version: 1.0.0
  description: API documentation for the Blood Bank Management System (BBMS).
paths:
  /api/auth/admin/users/:
    get:
      operationId: auth_admin_users_list
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
          description: ''
    post:
      operationId: auth_admin_users_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUser'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/auth/admin/users/{id}/:
    get:
      operationId: auth_admin_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    put:
      operationId: auth_admin_users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUser'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: auth_admin_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUser'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    delete:
      operationId: auth_admin_users_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve the currently authenticated user's details.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Retrieve the authenticated user's profile.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    put:
      operationId: auth_profile_update
      description: Update the authenticated user's profile.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Profile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Profile'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/blood/:
    get:
      operationId: blood_list
      tags:
      - blood
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloodUnit'
          description: ''
    post:
      operationId: blood_create
      tags:
      - blood
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodUnit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodUnit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodUnit'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodUnit'
          description: ''
  /api/blood-requests/:
    post:
      operationId: blood_requests_create
      tags:
      - blood-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequest'
          description: ''
  /api/blood-requests/{request_id}/cancel/:
    post:
      operationId: blood_requests_cancel_create
      description: Cancel an approved blood request and release its reserved stock.
        Only the request owner or staff/admin may cancel it.
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - blood-requests
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequestCancelResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/blood-requests/{request_id}/process/:
    post:
      operationId: blood_requests_process_create
      description: Approve, reject, or fulfil a blood request. Approving a request
        reserves compatible blood stock.
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - blood-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodRequestProcessInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodRequestProcessInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodRequestProcessInput'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodRequestProcessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/blood-requests/list/:
    get:
      operationId: blood_requests_list_list
      description: Hospitals see their own requests; staff/admin can see all requests.
      tags:
      - blood-requests
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloodRequest'
          description: ''
  /api/blood/{id}/:
    get:
      operationId: blood_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - blood
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodUnit'
          description: ''
    put:
      operationId: blood_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - blood
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodUnit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodUnit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodUnit'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodUnit'
          description: ''
    patch:
      operationId: blood_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - blood
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBloodUnit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBloodUnit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBloodUnit'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodUnit'
          description: ''
    delete:
      operationId: blood_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - blood
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/blood/availability/:
    get:
      operationId: blood_availability_retrieve
      description: Check available blood stock for a specified blood group and location.
        Only hospital users can access this endpoint.
      parameters:
      - in: query
        name: blood_group
        schema:
          type: string
        description: Blood group to search for, such as O+ or A-.
        required: true
      - in: query
        name: location
        schema:
          type: string
        description: Hospital or blood-bank location.
        required: true
      tags:
      - blood
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodAvailabilityResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/blood/stock-summary/:
    get:
      operationId: blood_stock_summary_list
      description: Retrieve available, non-expired blood-stock totals grouped by blood
        group and blood-bank location. Only staff and administrators can access this
        endpoint.
      tags:
      - blood
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockSummaryItem'
          description: ''
  /api/donors/:
    get:
      operationId: donors_list
      description: List donor profiles. Supports filtering by blood group and city.
      tags:
      - donors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonorList'
          description: ''
  /api/donors/{donor_id}/donations/:
    post:
      operationId: donors_donations_create
      description: Record a donation for a specified donor.
      parameters:
      - in: path
        name: donor_id
        schema:
          type: integer
        required: true
      tags:
      - donors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationRecord'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DonationRecord'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DonationRecord'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationRecord'
          description: ''
        '400':
          description: Invalid donation data or donor is not eligible.
  /api/donors/donations/{id}/certificate/:
    get:
      operationId: donors_donations_certificate_retrieve
      description: Download a donation certificate.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - donors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Donation certificate PDF.
        '403':
          description: Permission denied.
        '404':
          description: Donation record not found.
  /api/donors/eligibility/:
    get:
      operationId: donors_eligibility_retrieve
      description: Check the authenticated donor's donation eligibility.
      tags:
      - donors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eligibility'
          description: ''
        '404':
          description: Donor profile not found.
  /api/donors/me/donations/:
    get:
      operationId: donors_me_donations_list
      description: List donation records belonging to the authenticated donor.
      tags:
      - donors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonationRecord'
          description: ''
  /api/donors/profile/:
    get:
      operationId: donors_profile_retrieve
      description: Retrieve the authenticated donor's profile.
      tags:
      - donors
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonorProfile'
          description: ''
        '404':
          description: Donor profile not found.
    post:
      operationId: donors_profile_create
      description: Create a donor profile for the authenticated donor.
      tags:
      - donors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonorProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DonorProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DonorProfile'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonorProfile'
          description: ''
        '400':
          description: Invalid donor profile data.
        '409':
          description: Donor profile already exists.
    put:
      operationId: donors_profile_update
      description: Update the authenticated donor's profile.
      tags:
      - donors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonorProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DonorProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DonorProfile'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonorProfile'
          description: ''
        '400':
          description: Invalid donor profile data.
        '404':
          description: Donor profile not found.
  /api/inventory/:
    get:
      operationId: inventory_list
      tags:
      - inventory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
