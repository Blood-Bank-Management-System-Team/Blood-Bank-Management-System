components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - LOGIN_FAILED
      - APPROVE
      - REJECT
      - FULFIL
      - OTHER
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `LOGIN` - Login
        * `LOGIN_FAILED` - Login failed
        * `APPROVE` - Approve
        * `REJECT` - Reject
        * `FULFIL` - Fulfil
        * `OTHER` - Other
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        role:
          $ref: '#/components/schemas/Role635Enum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - id
      - username
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        user:
          type: string
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        model_name:
          type: string
          maxLength: 100
        object_id:
          type: string
          maxLength: 64
        description:
          type: string
          maxLength: 255
        ip_address:
          type: string
          nullable: true
      required:
      - action
      - id
      - timestamp
      - user
    BloodAvailabilityResponse:
      type: object
      properties:
        blood_group:
          type: string
        location:
          type: string
        available_units:
          type: integer
        status:
          type: string
      required:
      - available_units
      - blood_group
      - location
      - status
    BloodGroupEnum:
      enum:
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - O+
      - O-
      type: string
      description: |-
        * `A+` - A+
        * `A-` - A-
        * `B+` - B+
        * `B-` - B-
        * `AB+` - AB+
        * `AB-` - AB-
        * `O+` - O+
        * `O-` - O-
    BloodRequest:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          readOnly: true
        blood_group:
          $ref: '#/components/schemas/BloodGroupEnum'
        units:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        location:
          type: string
          maxLength: 100
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        required_date:
          type: string
          format: date
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BloodRequestStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blood_group
      - created_at
      - location
      - priority
      - request_id
      - status
      - units
    BloodRequestCancelResponse:
      type: object
      properties:
        request_id:
          type: string
        status:
          type: string
        detail:
          type: string
      required:
      - detail
      - request_id
      - status
    BloodRequestProcessInput:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/BloodRequestProcessInputStatusEnum'
      required:
      - status
    BloodRequestProcessInputStatusEnum:
      enum:
      - approved
      - rejected
      - fulfilled
      type: string
      description: |-
        * `approved` - approved
        * `rejected` - rejected
        * `fulfilled` - fulfilled
    BloodRequestProcessResponse:
      type: object
      properties:
        request_id:
          type: string
        blood_group:
          type: string
        units:
          type: integer
        location:
          type: string
        status:
          type: string
      required:
      - blood_group
      - location
      - request_id
      - status
      - units
    BloodRequestStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - fulfilled
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `fulfilled` - Fulfilled
        * `cancelled` - Cancelled
    BloodUnit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        blood_group:
          $ref: '#/components/schemas/BloodGroupEnum'
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        collection_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
        is_expired:
          type: boolean
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
        bank_location:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bank_location
      - blood_group
      - collection_date
      - created_at
      - expiry_date
      - id
      - is_available
      - is_expired
      - quantity
      - updated_at
    DonationRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        donation_date:
          type: string
          format: date
        blood_bank_location:
          type: string
          maxLength: 200
        units:
          type: integer
          maximum: 2
          minimum: 1
        recorded_by:
          type: string
          readOnly: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blood_bank_location
      - created_at
      - donation_date
      - id
      - recorded_by
    DonorList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        phone:
          type: string
        blood_group:
          $ref: '#/components/schemas/BloodGroupEnum'
        city:
          type: string
          maxLength: 100
        last_donation_date:
          type: string
          format: date
          nullable: true
        eligible:
          type: boolean
          readOnly: true
        next_eligible_date:
          type: string
          format: date
          nullable: true
          readOnly: true
      required:
      - blood_group
      - city
      - eligible
      - id
      - next_eligible_date
      - phone
      - username
    DonorProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        blood_group:
          $ref: '#/components/schemas/BloodGroupEnum'
        date_of_birth:
          type: string
          format: date
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,1})?$
        gender:
          $ref: '#/components/schemas/GenderEnum'
        address:
          type: string
        city:
          type: string
          maxLength: 100
        last_donation_date:
          type: string
          format: date
          nullable: true
        has_chronic_illness:
          type: boolean
        on_medication:
          type: boolean
        recent_surgery_or_tattoo_6_months:
          type: boolean
        recent_illness_or_fever_2_weeks:
          type: boolean
        is_pregnant_or_breastfeeding:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - blood_group
      - city
      - created_at
      - date_of_birth
      - gender
      - id
      - updated_at
      - weight_kg
    Eligibility:
      type: object
      properties:
        eligible:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        next_eligible_date:
          type: string
          format: date
      required:
      - eligible
      - next_eligible_date
      - reasons
    GenderEnum:
      enum:
      - MALE
      - FEMALE
      - OTHER
      type: string
      description: |-
        * `MALE` - Male
        * `FEMALE` - Female
        * `OTHER` - Other
    Login:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LowStockAlert:
      type: object
      properties:
        blood_group:
          type: string
        available_quantity:
          type: integer
        minimum_quantity:
          type: integer
        message:
          type: string
      required:
      - available_quantity
      - blood_group
      - message
      - minimum_quantity
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    PatchedAdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        role:
          $ref: '#/components/schemas/Role635Enum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
    PatchedBloodUnit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        blood_group:
          $ref: '#/components/schemas/BloodGroupEnum'
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        collection_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
        is_expired:
          type: boolean
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
        bank_location:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PriorityEnum:
      enum:
      - emergency
      - scheduled
      type: string
      description: |-
        * `emergency` - Emergency
        * `scheduled` - Scheduled
    Profile:
      type: object
      properties:
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        role:
          allOf:
          - $ref: '#/components/schemas/Role635Enum'
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          oneOf:
          - type: string
            pattern: ^[6-9]\d{9}$
          - type: string
            maxLength: 0
      required:
      - email
      - role
      - username
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RegisterRoleEnum'
          default: DONOR
        phone:
          type: string
          maxLength: 20
      required:
      - email
      - id
      - password
      - username
    RegisterRoleEnum:
      enum:
      - DONOR
      type: string
      description: '* `DONOR` - Donor'
    Role635Enum:
      enum:
      - DONOR
      - STAFF
      - HOSPITAL
      - ADMIN
      type: string
      description: |-
        * `DONOR` - Donor
        * `STAFF` - Blood Bank Staff
        * `HOSPITAL` - Hospital/Patient
        * `ADMIN` - Administrator
    StockSummaryItem:
      type: object
      properties:
        blood_group:
          type: string
        bank_location:
          type: string
        total_quantity:
          type: integer
      required:
      - bank_location
      - blood_group
      - total_quantity
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        role:
          allOf:
          - $ref: '#/components/schemas/Role635Enum'
          readOnly: true
        phone:
          type: string
          readOnly: true
      required:
      - email
      - phone
      - role
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
