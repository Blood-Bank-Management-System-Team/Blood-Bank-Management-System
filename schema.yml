      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodUnit'
          description: ''
    put:
      operationId: inventory_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodUnit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloodUnit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloodUnit'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodUnit'
          description: ''
    patch:
      operationId: inventory_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBloodUnit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBloodUnit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBloodUnit'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodUnit'
          description: ''
    delete:
      operationId: inventory_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/inventory/availability/:
    get:
      operationId: inventory_availability_retrieve
      description: Check available blood stock for a specified blood group and location.
        Only hospital users can access this endpoint.
      parameters:
      - in: query
        name: blood_group
        schema:
          type: string
        description: Blood group to search for, such as O+ or A-.
        required: true
      - in: query
        name: location
        schema:
          type: string
        description: Hospital or blood-bank location.
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloodAvailabilityResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/inventory/stock-summary/:
    get:
      operationId: inventory_stock_summary_list
      description: Retrieve available, non-expired blood-stock totals grouped by blood
        group and blood-bank location. Only staff and administrators can access this
        endpoint.
      tags:
      - inventory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockSummaryItem'
          description: ''
  /api/notifications/low-stock/:
    get:
      operationId: notifications_low_stock_list
      description: Retrieve low-stock alerts for blood groups whose available quantities
        fall below their configured minimum thresholds. Only administrators can access
        this endpoint.
      tags:
      - notifications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LowStockAlert'
          description: ''
  /api/reports/audit-logs/:
    get:
      operationId: reports_audit_logs_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - reports
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/reports/summary/:
    get:
      operationId: reports_summary_retrieve
      description: Generate a report summary for the specified date range. Only staff
        and administrators can access this endpoint.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Start date for the report.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: End date for the report.
      tags:
      - reports
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
