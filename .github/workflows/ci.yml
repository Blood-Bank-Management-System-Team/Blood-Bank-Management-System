name: CI

# Runs on every push and every pull request into main
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # Smoke check for CD: only builds the image (no push) so a broken Dockerfile is caught on PRs.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bbms
          POSTGRES_USER: bbms
          POSTGRES_PASSWORD: bbms
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: bbms
      DB_USER: bbms
      DB_PASSWORD: bbms
      DB_HOST: localhost
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "True"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8

      - name: Lint (style check)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Django checks and tests
        run: |
          if [ -f manage.py ]; then
            python manage.py check
            python manage.py migrate --noinput
            python manage.py test
          else
            echo "No manage.py yet - skipping Django tests"
          fi
