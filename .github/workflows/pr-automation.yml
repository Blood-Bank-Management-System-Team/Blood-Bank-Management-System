
name: PR automation

# Runs whenever a pull request is opened or edited
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Assign the PR to the person who raised it
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [context.payload.pull_request.user.login],
            });

      - name: Label the PR by sprint from the branch name
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref.toLowerCase();
            const m = branch.match(/bb-(\d+)/);

            if (!m) {
              core.info('No BB issue number found in the source branch.');
              return;
            }

            const n = parseInt(m[1], 10);
            const label = n <= 13 ? 'sprint-1' : n <= 31 ? 'sprint-2' : 'backlog';

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });

      - name: Check whether the PR references a backlog issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;
            const headBranch = context.payload.pull_request.head.ref;

            const hasClosingReference =
              /\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\s+#\d+\b/i.test(body);

            core.info(`PR number: ${prNumber}`);
            core.info(`Source branch: ${headBranch}`);
            core.info(`Closing reference found: ${hasClosingReference}`);

            if (!hasClosingReference) {
              core.warning(
                `PR #${prNumber} has no closing issue reference. Add the correct issue reference if applicable.`
              );
            } else {
              core.info('Issue-closing reference check passed.');
            }
