name: PR automation

# Runs whenever a pull request is opened or edited
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Assign the PR to the person who raised it
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [context.payload.pull_request.user.login],
            });

      - name: Label the PR by sprint from the branch name
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref.toLowerCase();
            const m = branch.match(/bb-(\d+)/);
            if (!m) return;
            const n = parseInt(m[1], 10);
            const label = n <= 13 ? 'sprint-1' : n <= 31 ? 'sprint-2' : 'backlog';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });

      - name: Make sure the PR is linked to a backlog issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            if (!/(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body)) {
              core.setFailed('Add "Closes #<issue number>" to the PR description so the backlog card moves automatically.');
            }
