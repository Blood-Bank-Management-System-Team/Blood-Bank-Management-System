name: PR automation

# Runs whenever a pull request is opened or edited
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Assign the PR to the person who raised it
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [context.payload.pull_request.user.login],
            });

      - name: Label the PR by sprint from the branch name
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref.toLowerCase();
            const m = branch.match(/bb-(\d+)/);
            if (!m) return;
            const n = parseInt(m[1], 10);
            const label = n <= 13 ? 'sprint-1' : n <= 31 ? 'sprint-2' : 'backlog';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });

      - name: Make sure the PR is linked to a backlog issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;

            const skipIssueLink =
              /^\s*Skip-Issue-Link:\s*true\s*$/im.test(body);

            const closingReference =
              /\b(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\s+#\d+\b/i;

            const hasClosingReference = closingReference.test(body);

            core.info(`Checking PR #${prNumber} for an issue link.`);
            core.info(`Skip-Issue-Link opt-out: ${skipIssueLink}`);
            core.info(`Closing reference found: ${hasClosingReference}`);

            if (skipIssueLink) {
              core.info('Issue-link check skipped by explicit opt-out.');
            } else if (!hasClosingReference) {
              core.setFailed(
                `PR #${prNumber} needs an issue-closing reference, such as "Closes #23", ` +
                'or the explicit opt-out "Skip-Issue-Link: true" for maintenance PRs.'
              );
            } else {
              core.info('Issue-closing reference check passed.');
            }
